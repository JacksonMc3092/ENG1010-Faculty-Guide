name: Build ENG 1010 sample syllabus

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
      - name: Build and validate Word syllabus
        run: |
          mkdir -p downloads
          pandoc source/ENG1010_Sample_Syllabus_Fall_2026.html \
            --from=html \
            --to=docx \
            --output=downloads/ENG1010_Sample_Syllabus_Fall_2026.docx
          test -s downloads/ENG1010_Sample_Syllabus_Fall_2026.docx
          unzip -t downloads/ENG1010_Sample_Syllabus_Fall_2026.docx
          test -f resources/ENG1010_7-Week_Course_Plan.html
          grep -q 'downloads/ENG1010_Sample_Syllabus_Fall_2026.docx' quick-start.html
          grep -q 'resources/ENG1010_7-Week_Course_Plan.html' quick-start.html
      - name: Remove temporary assembly files
        run: |
          rm -rf .tmp-syllabus
          rm -f .github/workflows/assemble-eng1010-syllabus.yml
      - name: Commit resources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish ENG 1010 Quick Start syllabus'
          git push
