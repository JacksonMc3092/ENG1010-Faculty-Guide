name: Complete Faculty Guide migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/complete-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore Faculty Guide files
        shell: bash
        run: |
          set -euo pipefail
          cat .migration/part-* > /tmp/faculty-guide.b64
          base64 --decode /tmp/faculty-guide.b64 > /tmp/faculty-guide.zip
          unzip -o /tmp/faculty-guide.zip -d .
          rm -rf .migration
          rm -f .github/workflows/complete-migration.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Migrate complete ENG 1010 Faculty Guide"
          git push
