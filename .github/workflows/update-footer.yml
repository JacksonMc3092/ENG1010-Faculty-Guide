name: Update Faculty Guide footer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update footer on all guide pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          title = 'CT State Community College - Three Rivers | English 1010: Composition Faculty Guide'
          note = 'This website is an independent faculty resource and is not an official CT State Community College website. It is provided for reference only.'
          pages = ['index.html','getting-started.html','quick-start.html','course-overview.html','corequisite-model.html','module-guide.html','assignments.html','instructional-strategies.html','assessment.html','syllabus-templates.html','policies.html','ai-policy.html','faculty-support.html']
          footer = f'<footer class="site-footer"><p><strong>{title}</strong></p><p class="fg-footer-disclaimer">{note}</p><p>Last updated: August 2026</p></footer>'

          for filename in pages:
            p = Path(filename)
            text = p.read_text(encoding='utf-8')
            new, count = re.subn(r'<footer(?:\s+[^>]*)?>.*?</footer>', footer, text, count=1, flags=re.S|re.I)
            if count != 1:
              raise SystemExit(f'Footer replacement failed for {filename}: {count}')
            p.write_text(new, encoding='utf-8')

          css = Path('assets/faculty-review.css')
          c = css.read_text(encoding='utf-8')
          marker = '/* Footer reference disclaimer */'
          if marker not in c:
            c += '''\n\n/* Footer reference disclaimer */\nfooter .fg-footer-disclaimer {\n  font-size: .82rem !important;\n  line-height: 1.45 !important;\n  font-weight: 400 !important;\n  opacity: .86;\n  max-width: 760px;\n  margin: 8px auto !important;\n}\n'''
          css.write_text(c, encoding='utf-8')
          PY
      - name: Validate footer update
        run: |
          python - <<'PY'
          from pathlib import Path
          pages = ['index.html','getting-started.html','quick-start.html','course-overview.html','corequisite-model.html','module-guide.html','assignments.html','instructional-strategies.html','assessment.html','syllabus-templates.html','policies.html','ai-policy.html','faculty-support.html']
          title = 'CT State Community College - Three Rivers | English 1010: Composition Faculty Guide'
          note = 'This website is an independent faculty resource and is not an official CT State Community College website. It is provided for reference only.'
          for f in pages:
            t = Path(f).read_text(encoding='utf-8')
            assert title in t, f'missing title in {f}'
            assert note in t, f'missing disclaimer in {f}'
            assert 'fg-footer-disclaimer' in t, f'missing disclaimer class in {f}'
          assert 'Footer reference disclaimer' in Path('assets/faculty-review.css').read_text(encoding='utf-8')
          print('Footer validation passed')
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/update-footer.yml
      - name: Commit footer update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Update Faculty Guide footer disclaimer'
          git push
