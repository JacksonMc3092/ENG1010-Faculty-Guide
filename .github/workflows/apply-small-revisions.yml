name: Apply small Faculty Guide revisions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-small-revisions.yml'
      - '.publish-tools/apply-small-revisions.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare parser
        run: python -m pip install --quiet beautifulsoup4
      - name: Apply revisions
        run: python .publish-tools/apply-small-revisions.py
      - name: Validate revisions
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup

          co = BeautifulSoup(Path('corequisite-model.html').read_text(encoding='utf-8'), 'html.parser')
          text = co.get_text(' ', strip=True)
          assert '3 Pass ENG 1010 + Do Not Participate in ENG 0910' in text
          assert 'NP (Non-Participation)' in text

          assess = BeautifulSoup(Path('assessment.html').read_text(encoding='utf-8'), 'html.parser')
          at = assess.get_text(' ', strip=True)
          assert 'At least one major revision per semester' in at
          assert 'Grade averaging (average original + revision) or grade replacement' in at
          assert 'Requiring a revision memo explaining changes that the student made in the revision' in at

          css = Path('assets/faculty-review.css').read_text(encoding='utf-8')
          assert 'August 13 small revision pass' in css
          assert '.prompt-box .prompt-text + p' in css
          assert '.module-card {' in css
          print('Small revision validation passed')
          PY
      - name: Clean temporary files
        run: |
          rm -f .publish-tools/apply-small-revisions.py
          rm -f .github/workflows/apply-small-revisions.yml
          rmdir .publish-tools 2>/dev/null || true
      - name: Commit revisions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply small Faculty Guide refinements'
          git push
