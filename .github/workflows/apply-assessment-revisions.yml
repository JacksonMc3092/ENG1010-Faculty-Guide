name: Apply approved Assessment revisions

on:
  push:
    branches: [agent/publishing-ready]
    paths:
      - '.github/workflows/apply-assessment-revisions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/publishing-ready

      - name: Apply approved Assessment edits
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('assessment.html')
          s = p.read_text(encoding='utf-8')
          original = s

          replacements = {
            '<h2>Assessment Philosophy</h2>': '<h2>Assessment Approaches</h2>',
            '<p>Effective assessment in ENG 1010 balances <strong>formative feedback</strong> (helping students improve) with <strong>summative evaluation</strong> (measuring final achievement). This page provides rubrics aligned with course learning outcomes, grading strategies that promote equity and transparency, and tools for managing assessment workload efficiently.</p>': '<p>Assessment in ENG 1010 should balance formative feedback that helps students develop as writers with summative evaluation of their work. The resources on this page offer sample rubrics, grading approaches, and feedback strategies that instructors may adapt to their own course design while remaining aligned with the ENG 1010 learning outcomes.</p>',
            '<p style="margin-top: 15px;"><strong>Key Principle:</strong> Assessment should serve learning. Students should always understand why they received a particular grade and what they can do to improve.</p>': '<p style="margin-top: 15px;"><strong>Key Principle:</strong> Students should have clear criteria for assessment and meaningful information about their strengths, areas for development, and opportunities for improvement.</p>',
            '<h2>📝 Essay 1 Rubric: Close Reading &amp; Critical Analysis</h2>': '<h2>Sample Essay 1 Rubric: Close Reading &amp; Critical Analysis</h2>',
            '<div class="rubric-header">Essay 1 Rubric (100 points total)</div>': '<div class="rubric-header">Sample Essay 1 Rubric (100 points total)</div>',
            '<h2>📚 Essay 2 Rubric: Synthesis &amp; Argument</h2>': '<h2>Sample Essay 2 Rubric: Synthesis &amp; Argument</h2>',
            '<p><strong>Assignment:</strong> 5-6 pages synthesizing multiple sources to develop an original argument. Assesses students\' ability to enter scholarly conversations and position themselves within existing debates.</p>': '<p><strong>Assignment:</strong> 5-7 pages synthesizing multiple sources to develop an original argument. This sample assignment asks students to respond to different perspectives, synthesize sources, and develop their own position within a conversation of ideas.</p>',
            '<div class="rubric-header">Essay 2 Rubric (100 points total)</div>': '<div class="rubric-header">Sample Essay 2 Rubric (100 points total)</div>',
            '<h2>🔬 Essay 3 Rubric: Research-Based Argument</h2>': '<h2>Sample Essay 3 Rubric: Research-Based Argument</h2>',
            '<p><strong>Assignment:</strong> 7-9 pages making an original, research-based argument using 6-8 credible sources. This is the culminating project demonstrating mastery of all course learning outcomes.</p>': '<p><strong>Assignment:</strong> 6-8 pages making an original, research-based argument using 6-8 credible sources. This sample project provides students with an opportunity to integrate and demonstrate multiple ENG 1010 learning outcomes through sustained research-based writing.</p>',
            '<div class="rubric-header">Essay 3 Rubric (100 points total)</div>': '<div class="rubric-header">Sample Essay 3 Rubric (100 points total)</div>',
            '<li>Participation/engagement: 10-15%</li>': '<li>Course engagement and process work: 10-15%</li>',
            '<h4>📈 Specifications Grading</h4>': '<h4>Specifications Grading (Optional Approach)</h4>',
            '<h2>📁 Portfolio Assessment (Optional)</h2>': '<h2>Portfolio Assessment: An Optional Approach</h2>',
            '<h2>🔗 Assessing ENG 0910 Students</h2>': '<h2>Assessing Students Enrolled in ENG 0910</h2>',
            '<p>Students in the ENG 0910 corequisite workshop receive a separate grade (Pass/No Pass) for the workshop. However, their work in ENG 1010 is assessed using the same rubrics and standards as all students.</p>': '<p>Students enrolled in ENG 0910 receive a separate grade for the workshop according to the ENG 0910 grading guidelines outlined in the Corequisite Model section. Their ENG 1010 work is assessed according to the same ENG 1010 learning outcomes and academic standards as other students. The additional workshop time provides support to help students meet those expectations.</p>',
          }

          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected Assessment text not found: {old[:100]}')
              s = s.replace(old, new, 1)

          # Remove the Labor-Based Grading card entirely.
          labor_pattern = re.compile(
              r'<div class="strategy-card">\s*<h4>✅ Labor-Based Grading \(Alternative\)</h4>.*?</div>\s*(?=<div class="strategy-card">\s*<h4>📈 Specifications Grading</h4>)',
              re.S,
          )
          s, n = labor_pattern.subn('', s, count=1)
          if n != 1:
              raise SystemExit(f'Expected to remove one Labor-Based Grading card; removed {n}')

          # Remove decorative emoji from headings/cards while preserving semantic icons in tips/notes.
          heading_icons = '📝📚🔬⚖️📊🔄✅📈💬📁🔗🎯⏱️🧭'
          s = re.sub(r'(<h[234][^>]*>)([' + re.escape(heading_icons) + r']+\ufe0f?\s*)', r'\1', s)

          # Give the dense Assessment page more breathing room.
          s = s.replace('margin: 50px 0 20px 0;', 'margin: 60px 0 24px 0;', 1)
          s = s.replace('margin: 35px 0 15px 0;', 'margin: 42px 0 18px 0;', 1)
          s = s.replace('margin-bottom: 16px;\n            font-size: 1.05em;', 'margin-bottom: 20px;\n            font-size: 1.05em;', 1)

          if s == original:
              raise SystemExit('No Assessment changes were made')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate approved Assessment state
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('assessment.html').read_text(encoding='utf-8')

          required = [
              'Assessment Approaches',
              'Sample Essay 1 Rubric',
              'Sample Essay 2 Rubric',
              '5-7 pages',
              'Sample Essay 3 Rubric',
              '6-8 pages',
              'Course engagement and process work: 10-15%',
              'Specifications Grading (Optional Approach)',
              'Portfolio Assessment: An Optional Approach',
              'Assessing Students Enrolled in ENG 0910',
              'ENG 0910 grading guidelines outlined in the Corequisite Model section',
              'id="main-content"',
              'aria-current="page"',
          ]
          forbidden = [
              'Labor-Based Grading',
              'Grade on completion/effort, not quality',
              '7-9 pages',
              '5-6 pages',
              'culminating project demonstrating mastery of all course learning outcomes',
              'Participation/engagement: 10-15%',
              'separate grade (Pass/No Pass) for the workshop',
          ]

          missing = [x for x in required if x not in s]
          leftovers = [x for x in forbidden if x in s]
          if missing or leftovers:
              raise SystemExit(f'Missing required: {missing}; forbidden leftovers: {leftovers}')
          print('Approved Assessment revision validation passed')
          PY

      - name: Commit clean Assessment revision
        run: |
          rm -f .github/workflows/apply-assessment-revisions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply approved Assessment revisions"
          git push origin HEAD:agent/publishing-ready
