name: Apply Scholar's Compass typography

on:
  push:
    branches: [main]
    paths:
      - '.publish-tools/apply-scholar-typography.py'

permissions:
  contents: write

jobs:
  typography:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply typography alignment
        run: python3 .publish-tools/apply-scholar-typography.py
      - name: Validate typography
        run: |
          grep -q "SCHOLARS COMPASS TYPOGRAPHY ALIGNMENT" assets/faculty-guide.css
          grep -q "font-size: 18px" assets/faculty-guide.css
          grep -q "'Segoe UI', Tahoma, Geneva, Verdana, sans-serif" assets/faculty-guide.css
      - name: Commit typography update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-scholar-typography.yml .publish-tools/apply-scholar-typography.py
          git add assets/faculty-guide.css
          git commit -m "Align Faculty Guide typography with Scholar's Compass"
          git push
