name: Polish Faculty Guide shell v2

on:
  push:
    branches: [agent/publishing-ready]
    paths:
      - '.github/workflows/polish-faculty-shell-v2.yml'

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/publishing-ready
      - name: Append cascade safeguards
        run: |
          printf '%s\n' '' '/* Cascade safeguards against legacy inline heading rules. */' '.fg-site-name {' '  margin: 0 !important;' '  padding: 0 !important;' '  text-transform: none !important;' '  text-shadow: none !important;' '  letter-spacing: .01em !important;' '}' '.fg-site-name::before,' '.fg-site-name::after { display: none !important; content: none !important; }' '.fg-nav-group:focus-within:not(.is-open) .fg-dropdown { display: none; }' '.fg-nav-group.is-open:focus-within .fg-dropdown { display: block; }' >> assets/faculty-guide.css
      - name: Validate shell assets
        run: |
          grep -q 'fg-site-name::after' assets/faculty-guide.css
          grep -q 'fg-masthead' index.html
          grep -q 'fg-page-nav' policies.html
          test -f assets/faculty-guide.js
      - name: Commit polish and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/polish-faculty-shell.yml .github/workflows/polish-faculty-shell-v2.yml
          git add assets/faculty-guide.css
          git commit -m "Polish Faculty Guide shell cascade"
          git push
