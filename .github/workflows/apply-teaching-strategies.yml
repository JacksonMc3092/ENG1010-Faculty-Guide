name: Apply Teaching Strategies revision

on:
  push:
    branches: [agent/publishing-ready]
    paths:
      - '.github/workflows/apply-teaching-strategies.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/publishing-ready

      - name: Install parser
        run: python -m pip install --quiet beautifulsoup4

      - name: Apply approved page revisions
        run: python .publish-tools/patch-teaching.py

      - name: Validate page
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('instructional-strategies.html').read_text()
          checks={
            'skip link':'class="skip-link"' in s and 'id="main-content"' in s,
            'active page':'aria-current="page"' in s,
            'new opening':'Teaching Approaches' in s,
            'icons removed':'🌱' not in s and '🎯' not in s and '💡' not in s,
            'unsupported quotes removed':'Composition pedagogy research' not in s and 'Educational research on belonging' not in s,
            'technology neutral':'Screencast-O-Matic' not in s and 'Loom' not in s,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad:
              raise SystemExit('Validation failed: '+', '.join(bad))
          print('Teaching Strategies validation passed')
          PY

      - name: Commit clean revision
        run: |
          rm -f .github/workflows/apply-teaching-strategies.yml
          rm -rf .publish-tools
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Revise Teaching Strategies page"
          git push origin HEAD:agent/publishing-ready
