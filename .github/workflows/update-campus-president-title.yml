name: Update Campus President title

on:
  push:
    branches: [agent/publishing-ready]
    paths:
      - '.github/workflows/update-campus-president-title.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/publishing-ready

      - name: Update title across HTML pages
        run: |
          python - <<'PY'
          from pathlib import Path
          changed = []
          for p in Path('.').rglob('*.html'):
              s = p.read_text(encoding='utf-8')
              new = s.replace('Chief Executive Officer (CEO)', 'Campus President')
              new = new.replace('Chief Executive Officer', 'Campus President')
              new = new.replace('CEO', 'Campus President')
              if new != s:
                  p.write_text(new, encoding='utf-8')
                  changed.append(str(p))
          print('Updated files:', ', '.join(changed) if changed else 'none')
          PY

      - name: Validate terminology
        run: |
          python - <<'PY'
          from pathlib import Path
          leftovers = []
          for p in Path('.').rglob('*.html'):
              s = p.read_text(encoding='utf-8')
              if 'CEO' in s or 'Chief Executive Officer' in s:
                  leftovers.append(str(p))
          if leftovers:
              raise SystemExit('Old title remains in: ' + ', '.join(leftovers))
          print('Campus President terminology validation passed')
          PY

      - name: Commit clean revision
        run: |
          rm -f .github/workflows/update-campus-president-title.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No title changes were needed."
            exit 0
          fi
          git commit -m "Update Campus President title"
          git push origin HEAD:agent/publishing-ready
