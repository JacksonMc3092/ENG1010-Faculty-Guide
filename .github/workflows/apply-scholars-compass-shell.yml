name: Apply Scholar's Compass-inspired Faculty Guide shell

on:
  push:
    branches: [agent/publishing-ready]
    paths:
      - '.github/workflows/apply-scholars-compass-shell.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redesign:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: agent/publishing-ready

      - name: Install parser
        run: pip install beautifulsoup4

      - name: Apply shared shell without changing approved content
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup

          pages = [
              ('index.html', 'Faculty Guide Hub', 'Home', 'Overview, quick reference, and navigation for the ENG 1010 Faculty Guide.'),
              ('getting-started.html', 'Getting Started', 'Getting Started', 'Orientation, mission, guiding principles, and first steps for ENG 1010 faculty.'),
              ('course-overview.html', 'Course Overview', 'Getting Started', 'Official course description, student learning outcomes, required text, and course expectations.'),
              ('corequisite-model.html', 'Corequisite Model', 'Getting Started', 'ENG 1010 and ENG 0910 structure, placement guidance, and workshop support.'),
              ('module-guide.html', 'Module Guide', 'Planning & Teaching', 'A flexible sample framework for organizing the semester.'),
              ('assignments.html', 'Assignments', 'Planning & Teaching', 'Recommended assignment sequence, sample prompts, scaffolding, and planning guidance.'),
              ('instructional-strategies.html', 'Teaching Strategies', 'Planning & Teaching', 'Practical approaches for reading, writing, revision, active learning, and student support.'),
              ('assessment.html', 'Assessment', 'Planning & Teaching', 'Sample rubrics, grading approaches, feedback, revision, and portfolio options.'),
              ('syllabus-templates.html', 'Syllabus Guidance', 'Resources', 'ENG 1010 syllabus guidance and links to current CT State resources.'),
              ('policies.html', 'Policies', 'Resources', 'Three Rivers procedures and current CT State policy guidance for ENG 1010 faculty.'),
              ('ai-policy.html', 'AI Guidance', 'Resources', 'Guidance for course AI policies, teaching, student use, and academic integrity.'),
              ('faculty-support.html', 'Faculty Support', 'Resources', 'ENG 1010 contacts, Three Rivers student support, and faculty resources.'),
          ]
          meta = {p[0]: {'title':p[1], 'section':p[2], 'description':p[3]} for p in pages}
          order = [p[0] for p in pages]

          groups = [
              ('Getting Started', [
                  ('getting-started.html','Getting Started'),
                  ('course-overview.html','Course Overview'),
                  ('corequisite-model.html','Corequisite Model'),
              ]),
              ('Planning & Teaching', [
                  ('module-guide.html','Module Guide'),
                  ('assignments.html','Assignments'),
                  ('instructional-strategies.html','Teaching Strategies'),
                  ('assessment.html','Assessment'),
              ]),
              ('Resources', [
                  ('syllabus-templates.html','Syllabus Guidance'),
                  ('policies.html','Policies'),
                  ('ai-policy.html','AI Guidance'),
                  ('faculty-support.html','Faculty Support'),
              ]),
          ]

          def nav_group(label, links, current):
              link_html = ''.join(
                  f'<a href="{href}"' + (' aria-current="page"' if href == current else '') + f'>{title}</a>'
                  for href, title in links
              )
              return f'''<div class="fg-nav-group">
                <button type="button" data-fg-group-toggle aria-expanded="false">{label}<span class="fg-chevron" aria-hidden="true">▾</span></button>
                <div class="fg-dropdown">{link_html}</div>
              </div>'''

          def shell_html(current):
              current_section = meta[current]['section']
              groups_html = ''.join(nav_group(label, links, current) for label,links in groups)
              home_current = ' aria-current="page"' if current == 'index.html' else ''
              return f'''
              <div class="fg-masthead" role="banner">
                <div class="fg-masthead-inner">
                  <a class="fg-brand" href="index.html" aria-label="ENG 1010 Faculty Guide Hub">
                    <span class="fg-mark" aria-hidden="true">FG</span>
                    <span class="fg-brand-copy">
                      <h1 class="fg-site-name">Faculty Guide</h1>
                      <span class="fg-site-subtitle">ENG 1010: Composition | CT State - Three Rivers</span>
                    </span>
                  </a>
                  <div class="fg-actions">
                    <button class="fg-icon-button" type="button" data-fg-search-open aria-label="Search Faculty Guide"><span class="fg-icon" aria-hidden="true">⌕</span><span class="fg-action-label">Search</span></button>
                    <button class="fg-icon-button" type="button" data-fg-theme aria-label="Use dark theme"><span class="fg-icon" aria-hidden="true">◐</span></button>
                    <button class="fg-menu-button" type="button" data-fg-menu aria-expanded="false" aria-controls="faculty-guide-navigation"><span aria-hidden="true">☰</span><span>Menu</span></button>
                  </div>
                </div>
              </div>
              <div class="fg-nav-wrap" id="faculty-guide-navigation">
                <div class="fg-nav" role="navigation" aria-label="Faculty Guide">
                  <a class="fg-nav-home" href="index.html"{home_current}>Faculty Guide Hub</a>
                  {groups_html}
                  <span class="fg-nav-spacer"></span>
                  <span class="fg-section-chip">{current_section}</span>
                </div>
              </div>
              <div class="fg-search-backdrop" data-fg-search-backdrop aria-hidden="true">
                <div class="fg-search-dialog" role="dialog" aria-modal="true" aria-label="Search Faculty Guide">
                  <div class="fg-search-head">
                    <input class="fg-search-input" type="search" data-fg-search-input placeholder="Search pages and topics…" aria-label="Search Faculty Guide pages"/>
                    <button class="fg-search-close" type="button" data-fg-search-close aria-label="Close search">×</button>
                  </div>
                  <div class="fg-search-results" data-fg-search-results></div>
                </div>
              </div>
              '''

          def page_nav(soup, current):
              idx = order.index(current)
              previous = order[idx-1] if idx > 0 else None
              nxt = order[idx+1] if idx < len(order)-1 else None
              wrap = soup.new_tag('div', attrs={'class':'fg-page-nav', 'aria-label':'Faculty Guide page navigation'})
              if previous:
                  a = soup.new_tag('a', href=previous); a['class']='fg-prev'
                  lab=soup.new_tag('span',attrs={'class':'fg-page-nav-label'}); lab.string='Previous'
                  title=soup.new_tag('span',attrs={'class':'fg-page-nav-title'}); title.string=meta[previous]['title']
                  a.extend([lab,title]); wrap.append(a)
              else:
                  wrap.append(soup.new_tag('span',attrs={'aria-hidden':'true'}))
              hub=soup.new_tag('a',href='index.html'); hub['class']='fg-hub-link'
              lab=soup.new_tag('span',attrs={'class':'fg-page-nav-label'}); lab.string='Faculty Guide'
              title=soup.new_tag('span',attrs={'class':'fg-page-nav-title'}); title.string='Hub'
              hub.extend([lab,title]); wrap.append(hub)
              if nxt:
                  a=soup.new_tag('a',href=nxt); a['class']='fg-next'
                  lab=soup.new_tag('span',attrs={'class':'fg-page-nav-label'}); lab.string='Next'
                  title=soup.new_tag('span',attrs={'class':'fg-page-nav-title'}); title.string=meta[nxt]['title']
                  a.extend([lab,title]); wrap.append(a)
              else:
                  wrap.append(soup.new_tag('span',attrs={'aria-hidden':'true'}))
              return wrap

          def breadcrumb(soup,current):
              div=soup.new_tag('div',attrs={'class':'fg-breadcrumb','aria-label':'Breadcrumb'})
              a=soup.new_tag('a',href='index.html'); a.string='Faculty Guide Hub'; div.append(a)
              sep=soup.new_tag('span',attrs={'class':'fg-breadcrumb-sep','aria-hidden':'true'}); sep.string='/' ; div.append(sep)
              sec=soup.new_tag('span'); sec.string=meta[current]['section']; div.append(sec)
              if meta[current]['title'] != meta[current]['section']:
                  sep2=soup.new_tag('span',attrs={'class':'fg-breadcrumb-sep','aria-hidden':'true'}); sep2.string='/'; div.append(sep2)
                  cur=soup.new_tag('span'); cur.string=meta[current]['title']; div.append(cur)
              return div

          def add_assets(soup):
              for link in list(soup.find_all('link', href='assets/faculty-guide.css')): link.decompose()
              for script in list(soup.find_all('script', src='assets/faculty-guide.js')): script.decompose()
              css=soup.new_tag('link',rel='stylesheet',href='assets/faculty-guide.css')
              soup.head.append(css)
              js=soup.new_tag('script',src='assets/faculty-guide.js'); js['defer']='defer'
              soup.head.append(js)

          def rebuild_home(soup, main):
              main.clear()
              frag=BeautifulSoup('''
                <section class="fg-hub-hero">
                  <span class="fg-hub-kicker">CT State - Three Rivers</span>
                  <h2>About the ENG 1010 Faculty Guide</h2>
                  <p>This faculty guide brings together practical resources for teaching ENG 1010: Composition at CT State - Three Rivers. It is designed to support course planning, assignment design, instruction, and assessment while keeping the official course requirements, student learning outcomes, and current CT State policies in view.</p>
                </section>
                <div class="fg-hub-grid">
                  <section class="fg-hub-group">
                    <h3>Getting Started</h3>
                    <p>Course foundations, official expectations, and placement-linked support.</p>
                    <ul class="fg-hub-links">
                      <li><a href="getting-started.html">Getting Started</a></li>
                      <li><a href="course-overview.html">Course Overview</a></li>
                      <li><a href="corequisite-model.html">Corequisite Model</a></li>
                    </ul>
                  </section>
                  <section class="fg-hub-group">
                    <h3>Planning &amp; Teaching</h3>
                    <p>Flexible planning resources, assignments, teaching approaches, and assessment.</p>
                    <ul class="fg-hub-links">
                      <li><a href="module-guide.html">Module Guide</a></li>
                      <li><a href="assignments.html">Assignments</a></li>
                      <li><a href="instructional-strategies.html">Teaching Strategies</a></li>
                      <li><a href="assessment.html">Assessment</a></li>
                    </ul>
                  </section>
                  <section class="fg-hub-group">
                    <h3>Resources</h3>
                    <p>Syllabus guidance, policies, AI guidance, and faculty support.</p>
                    <ul class="fg-hub-links">
                      <li><a href="syllabus-templates.html">Syllabus Guidance</a></li>
                      <li><a href="policies.html">Policies</a></li>
                      <li><a href="ai-policy.html">AI Guidance</a></li>
                      <li><a href="faculty-support.html">Faculty Support</a></li>
                    </ul>
                  </section>
                </div>
                <section class="fg-quick-reference">
                  <h3>Quick Reference</h3>
                  <ul>
                    <li><strong>Curriculum Leader:</strong> Joseph Selvaggio, <a href="mailto:joseph.selvaggio@ctstate.edu">joseph.selvaggio@ctstate.edu</a></li>
                    <li><strong>Required Text:</strong> <em>They Say / I Say</em>, 6th ed. (2024)</li>
                    <li><strong>Course Number:</strong> ENG 1010 (formerly ENG 101)</li>
                    <li><strong>Credits:</strong> 3 credits</li>
                    <li><strong>Placement-linked support:</strong> ENG 0910 workshop for eligible students</li>
                    <li><strong>Student Learning Outcomes:</strong> 4 outcome areas covering rhetorical situations, authoritative sources, logical argument, and language conventions</li>
                  </ul>
                </section>
              ''','html.parser')
              for child in list(frag.contents): main.append(child)

          for filename in order:
              path=Path(filename)
              soup=BeautifulSoup(path.read_text(encoding='utf-8'),'html.parser')
              add_assets(soup)

              # Remove the Blackboard-era visual shell only. Main content and footer remain intact.
              old_header=soup.find('header')
              if old_header: old_header.decompose()
              old_nav=soup.find('nav')
              if old_nav: old_nav.decompose()
              for existing in list(soup.select('.fg-masthead,.fg-nav-wrap,.fg-search-backdrop,.fg-back-top')):
                  existing.decompose()

              body=soup.body
              skip=soup.find('a',href='#main-content')
              frag=BeautifulSoup(shell_html(filename),'html.parser')
              nodes=list(frag.contents)
              insert_at=1 if skip and skip.parent is body else 0
              for node in nodes:
                  body.insert(insert_at,node); insert_at += 1

              main=soup.find(id='main-content')
              if not main: raise SystemExit(f'{filename}: main-content missing')
              for old in list(main.select('.fg-breadcrumb,.fg-page-nav')): old.decompose()

              if filename == 'index.html':
                  rebuild_home(soup,main)
              else:
                  main.insert(0,breadcrumb(soup,filename))
                  main.append(page_nav(soup,filename))

              back=soup.new_tag('button',attrs={'class':'fg-back-top','type':'button','data-fg-back-top':'','aria-label':'Back to top'})
              back.string='↑'
              body.append(back)

              path.write_text(str(soup),encoding='utf-8')
          PY

      - name: Validate navigation, content preservation, and accessibility hooks
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup

          files=['index.html','getting-started.html','course-overview.html','corequisite-model.html','module-guide.html','assignments.html','instructional-strategies.html','assessment.html','syllabus-templates.html','policies.html','ai-policy.html','faculty-support.html']
          errors=[]
          locked_markers={
            'index.html':['About the ENG 1010 Faculty Guide','4 outcome areas covering rhetorical situations'],
            'getting-started.html':['First-Year Writing Task Force Mission','Equity does not mean lowering the shared course outcomes'],
            'course-overview.html':['Composition focuses on the study and practice of effective written communication','Curriculum Leader or Department Chair'],
            'corequisite-model.html':['Current Placement Criteria','2.8 or higher','250–262'],
            'module-guide.html':['planning resource, not a required sequence','Paraphrasing and quoting strategies','Signal phrases'],
            'assignments.html':['at least 20 pages of finished formal writing','Planning Note:','5-7 pages','6-8 pages'],
            'instructional-strategies.html':['Teaching Approaches'],
            'assessment.html':['Assessment Approaches','Portfolio Assessment: An Optional Approach'],
            'syllabus-templates.html':['Syllabus Guidance'],
            'policies.html':['Ronda.Charette@ctstate.edu','MUST be submitted'],
            'ai-policy.html':['AI Guidance for ENG 1010','AI Detection Requires Caution'],
            'faculty-support.html':['Tutoring and Academic Success Center','Center for Teaching','Help Improve This Guide'],
          }
          forbidden=['CEO','Chief Executive Officer','Policy Under Development','Labor-Based Grading','2023-2024 Placement Criteria']

          for name in files:
              raw=Path(name).read_text(encoding='utf-8')
              soup=BeautifulSoup(raw,'html.parser')
              text=soup.get_text(' ',strip=True)
              if len(soup.find_all('h1')) != 1: errors.append(f'{name}: expected exactly one h1')
              if not soup.select_one('.fg-masthead'): errors.append(f'{name}: missing new masthead')
              if not soup.select_one('.fg-nav-wrap'): errors.append(f'{name}: missing new navigation')
              if not soup.find('link',href='assets/faculty-guide.css'): errors.append(f'{name}: missing shared CSS')
              if not soup.find('script',src='assets/faculty-guide.js'): errors.append(f'{name}: missing shared JS')
              if soup.find('header'): errors.append(f'{name}: legacy header remains')
              if soup.find('nav'): errors.append(f'{name}: legacy nav remains')
              if not soup.find('a',href='#main-content'): errors.append(f'{name}: skip link missing')
              if not soup.find(id='main-content'): errors.append(f'{name}: main content missing')
              if name != 'index.html' and not soup.select_one('.fg-breadcrumb'): errors.append(f'{name}: breadcrumb missing')
              if name != 'index.html' and not soup.select_one('.fg-page-nav'): errors.append(f'{name}: previous/next navigation missing')
              if name == 'index.html' and len(soup.select('.fg-hub-group')) != 3: errors.append('index.html: hub groups missing')
              for marker in locked_markers[name]:
                  if marker not in text: errors.append(f'{name}: locked content marker missing: {marker}')
              for bad in forbidden:
                  if bad in text: errors.append(f'{name}: stale text remains: {bad}')
              for a in soup.find_all('a',href=True):
                  href=a['href'].split('#')[0].split('?')[0]
                  if href.endswith('.html') and not Path(href).exists(): errors.append(f'{name}: broken local link {href}')

          for asset in ['assets/faculty-guide.css','assets/faculty-guide.js']:
              if not Path(asset).exists() or Path(asset).stat().st_size < 1000: errors.append(f'{asset}: missing or unexpectedly small')

          if errors:
              print('\n'.join('ERROR: '+e for e in errors))
              raise SystemExit(1)
          print('DESIGN AUDIT PASSED: 12 pages use the new shell; locked content, local links, skip links, breadcrumbs, page navigation, search/theme assets, and one H1 per page validated.')
          PY

      - name: Commit redesigned Faculty Guide shell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-scholars-compass-shell.yml
          git add index.html getting-started.html course-overview.html corequisite-model.html module-guide.html assignments.html instructional-strategies.html assessment.html syllabus-templates.html policies.html ai-policy.html faculty-support.html assets/faculty-guide.css assets/faculty-guide.js
          git commit -m "Redesign Faculty Guide with Scholar's Compass-inspired shell"
          git push
