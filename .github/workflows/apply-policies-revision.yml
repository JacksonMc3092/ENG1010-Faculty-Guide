name: Apply Policies revision

on:
  push:
    branches: [agent/publishing-ready]
    paths:
      - '.github/workflows/apply-policies-revision.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/publishing-ready

      - name: Install parser
        run: python -m pip install beautifulsoup4

      - name: Apply approved Policies revision
        run: python .publish-tools/patch-policies.py

      - name: Validate page
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('policies.html').read_text(encoding='utf-8')
          checks={
            'skip link':'class="skip-link"' in s and 'id="main-content"' in s,
            'active page':'aria-current="page"' in s,
            'new opening':'Policy Guidance for ENG 1010 Faculty' in s,
            'Ronda mailto':'mailto:Ronda.Charette@ctstate.edu' in s,
            'dean mailto':'mailto:TR-AcademicDean@ctstate.edu' in s,
            'Joseph mailto':'mailto:joseph.selvaggio@ctstate.edu' in s,
            'academic engagement must':'MUST be submitted by the established deadline' in s,
            'department chair guidance':'Email the department chair if you have questions' in s,
            'student meeting step':'Meet with the student.' in s,
            'safety exception':'Immediate Safety Concerns' in s,
            'incomplete 61':'at least 61% of the course' in s,
            'conduct link':'https://ctstate.edu/conduct' in s,
            'calendar link':'https://ctstate.edu/academics/academic-calendar' in s,
            'old CEO claim removed':'Chief Executive Officer (CEO)' not in s,
            'old banner steps removed':'Faculty Services → Final Grades' not in s,
            'old week guess removed':'usually end of the first week' not in s,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad:
              raise SystemExit('Validation failed: '+', '.join(bad))
          print('Policies validation passed')
          PY

      - name: Commit clean revision
        run: |
          rm -f .github/workflows/apply-policies-revision.yml
          rm -rf .publish-tools
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Revise Policies page"
          git push origin HEAD:agent/publishing-ready
