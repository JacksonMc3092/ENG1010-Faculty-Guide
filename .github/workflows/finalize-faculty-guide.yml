name: Finalize Faculty Guide

on:
  push:
    branches: [agent/publishing-ready]
    paths:
      - '.github/workflows/finalize-faculty-guide.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: agent/publishing-ready

      - name: Install parser
        run: pip install beautifulsoup4

      - name: Apply locked revisions and Faculty Support rewrite
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import re

          CORE = [
              'index.html','getting-started.html','course-overview.html','corequisite-model.html',
              'module-guide.html','assignments.html','instructional-strategies.html','assessment.html',
              'syllabus-templates.html','policies.html','ai-policy.html','faculty-support.html'
          ]

          def load(name):
              p=Path(name); return p, BeautifulSoup(p.read_text(encoding='utf-8'),'html.parser')
          def save(p,soup): p.write_text(str(soup),encoding='utf-8')
          def heading(soup, text):
              for h in soup.find_all(['h2','h3','h4','h5']):
                  if text.lower() in h.get_text(' ',strip=True).lower(): return h
              return None
          def set_next_p(h, text):
              if h:
                  p=h.find_next('p')
                  if p: p.clear(); p.append(text)
          def html_into(tag, html):
              frag=BeautifulSoup(html,'html.parser')
              tag.clear()
              for child in list(frag.contents): tag.append(child)
          def replace_text_nodes(soup, old, new):
              for node in list(soup.find_all(string=lambda s: s and old in s)):
                  node.replace_with(str(node).replace(old,new))
          def strip_heading_icons(soup):
              for h in soup.find_all(['h2','h3','h4']):
                  for i in h.find_all('i'): i.decompose()
                  if h.string:
                      h.string=re.sub(r'^[\s\U0001F300-\U0001FAFF\u2600-\u27BF\ufe0f]+','',h.string).strip()
                  else:
                      # strip emoji from first text node only
                      for n in h.contents:
                          if isinstance(n,str) and n.strip():
                              n.replace_with(re.sub(r'^[\s\U0001F300-\U0001FAFF\u2600-\u27BF\ufe0f]+','',n).strip())
                              break
          def add_spacing(soup):
              if soup.find('style',id='publication-spacing'): return
              st=soup.new_tag('style',id='publication-spacing')
              st.string='''\n.content p, main p { margin-bottom: 20px; }\n.content h2, main h2 { margin-top: 60px; margin-bottom: 24px; }\n.content h3, main h3 { margin-top: 42px; margin-bottom: 18px; }\n.info-box, .warning-box, .tip-box, .highlight-box, .resource-box, .contact-card, .checklist-box { margin-top: 30px; margin-bottom: 30px; }\n'''
              soup.head.append(st)
          def normalize_footer(soup):
              f=soup.find('footer')
              if not f: return
              f.clear()
              p1=soup.new_tag('p'); strong=soup.new_tag('strong'); strong.string='CT State Community College | English 1010: Composition Faculty Guide'; p1.append(strong)
              p2=soup.new_tag('p'); p2.string='Last updated: August 2026'
              f.append(p1); f.append(p2)

          # HOME
          p,s=load('index.html')
          ws=s.select_one('.welcome-section')
          if ws:
              h=ws.find('h2'); h.string='About the CT State - Three Rivers ENG 1010 Faculty Guide'
              par=ws.find('p'); par.string='This faculty guide brings together practical resources for teaching ENG 1010: Composition at CT State - Three Rivers. It is designed to support course planning, assignment design, instruction, and assessment while keeping the official course requirements, student learning outcomes, and current CT State policies in view.'
          for card in s.select('.page-card'):
              ht=card.find(['h3','h4'])
              if not ht: continue
              title=ht.get_text(' ',strip=True)
              par=card.find('p')
              if title=='Course Overview' and par: par.string='Review the official course description, the four student learning outcome areas, and required textbook information.'
              if title=='Corequisite Model' and par: par.string='Review placement-linked ENG 0910 workshop support, current placement guidance, and the corequisite structure.'
          q=s.select_one('.quick-links')
          if q:
              for li in q.find_all('li'):
                  t=li.get_text(' ',strip=True)
                  if t.startswith('Corequisite:'):
                      html_into(li,'<strong>Placement-linked support:</strong> ENG 0910 workshop for eligible students')
                  elif t.startswith('Learning Outcomes:'):
                      html_into(li,'<strong>Student Learning Outcomes:</strong> 4 outcome areas covering rhetorical situations, authoritative sources, logical argument, and language conventions')
          save(p,s)

          # GETTING STARTED
          p,s=load('getting-started.html')
          h=heading(s,'Welcome to English 1010') or heading(s,'Welcome to ENG 1010')
          if h: h.string='Welcome to ENG 1010'
          wb=s.select_one('.welcome-box')
          if wb:
              html_into(wb,'''
              <p>Welcome to ENG 1010: Composition at CT State - Three Rivers. Whether you are teaching the course for the first time or returning to it, this guide is intended to provide a practical starting point while leaving room for instructors to make thoughtful choices about readings, assignments, classroom activities, and course design.</p>
              <p>ENG 1010 focuses on effective written communication across a variety of rhetorical situations. Students learn to respond to rhetorical situations, engage with and use authoritative sources, craft logical arguments, and apply language conventions. The resources in this guide are designed to help instructors meet those shared course outcomes while developing a course that reflects their own teaching approach and the needs of their students.</p>''')
          qs=heading(s,'Quick Start Checklist')
          ol=qs.find_next('ol') if qs else None
          if ol:
              html_into(ol,'''
              <li>Review the official course description and learning outcomes in the <a href="course-overview.html">Course Overview</a>.</li>
              <li>Familiarize yourself with the required text: <em>They Say / I Say with Readings</em>, 6th ed. (Norton, 2024).</li>
              <li>Review sample assignment prompts and rubrics in <a href="assignments.html">Assignments</a> and <a href="assessment.html">Assessment</a>.</li>
              <li>Use the <a href="module-guide.html">Module Guide</a> as a sample framework for organizing the semester.</li>
              <li>Email your syllabus to the department chair and the dean's office within two weeks of the start of the semester.</li>''')
          for hh in s.find_all(['h2','h3','h4']):
              txt=hh.get_text(' ',strip=True)
              if 'English Department Mission' in txt:
                  hh.string='First-Year Writing Task Force Mission'
                  set_next_p(hh,'The First-Year Writing Task Force at CT State - Three Rivers is committed to fostering critical thinking, effective communication, and cultural literacy. Through the study of literature, composition, and language, we prepare students to engage meaningfully with diverse texts and ideas, express themselves clearly and persuasively, and participate actively as informed citizens in a global society.')
              elif 'Course Philosophy' in txt:
                  hh.string='Guiding Principles for Teaching ENG 1010'
              elif txt.strip()=='Equity':
                  set_next_p(hh,'Students enter ENG 1010 with different educational experiences, responsibilities, and levels of preparation. Equity does not mean lowering the shared course outcomes; it means creating clear and accessible pathways for students to reach them. Thoughtful scaffolding, transparent expectations, accessible course materials, and opportunities for practice and revision can help students engage fully with college-level reading and writing.')
              elif 'Critical Reading' in txt:
                  set_next_p(hh,'Reading and writing are intertwined. Students learn to read complex texts critically, evaluate arguments and evidence, respond to ideas, and synthesize perspectives across multiple sources. These practices help students develop their own positions and integrate source material purposefully into their writing.')
          for sig in s.select('.signature'): sig.decompose()
          save(p,s)

          # COURSE OVERVIEW targeted approved refinements
          p,s=load('course-overview.html')
          replace_text_nodes(s,'without permission of the Curriculum Leader.','without permission of the Curriculum Leader or Department Chair.')
          replace_text_nodes(s,'from the text.','from the required text and/or supplemental readings.')
          for old,new in [('3-4 pages','3-5 pages'),('5-6 pages','5-7 pages'),('7-9 pages','6-8 pages')]: replace_text_nodes(s,old,new)
          for tag in list(s.find_all(['blockquote','div'])):
              if 'Patrick Sullivan' in tag.get_text(' ',strip=True): tag.decompose()
          save(p,s)

          # COREQUISITE MODEL: remove obsolete model, rebuild placement section
          p,s=load('corequisite-model.html')
          for box in list(s.select('.highlight-box')):
              if 'ENG 101S' in box.get_text(' ',strip=True): box.decompose()
          h=heading(s,'The ENG 1010/0910 Corequisite Course')
          if h:
              fp=h.find_next('p')
              if fp: fp.string='The ENG 1010/0910 corequisite model pairs ENG 1010 with the linked ENG 0910 support workshop for students whose placement indicates that additional writing support will be beneficial. ENG 0910 provides just-in-time support connected to ENG 1010 reading and writing work.'
          for pp in s.find_all('p'):
              if 'self-select this workshop' in pp.get_text(' ',strip=True):
                  pp.string='Students are placed into the linked workshop through the current CT State placement process.'
          for li in list(s.find_all('li')):
              t=li.get_text(' ',strip=True)
              if 'Guided Self-Placement' in t or 'Transition from Developmental Courses' in t: li.decompose()
          ph=heading(s,'Placement into ENG 1010/0910')
          if ph:
              sec=ph.find_parent('section')
              if sec:
                  sec.clear()
                  html_into(sec,'''
                  <h2 class="section-title">Placement into ENG 1010/0910</h2>
                  <p>Placement into ENG 1010 and ENG 0910 follows the current CT State placement process. GPA is used when available, with approved standardized measures used when appropriate. Accuplacer information is retained for students with historical scores.</p>
                  <h3>Current Placement Criteria</h3>
                  <table class="placement-table">
                    <thead><tr><th>Measure</th><th>ENG 1010</th><th>ENG 1010 + ENG 0910</th><th>ENG 0930</th><th>ENG 0960</th></tr></thead>
                    <tbody>
                      <tr><td>High School GPA</td><td>2.8 or higher</td><td>2.0–2.79</td><td>—</td><td>Below 2.0</td></tr>
                      <tr><td>SAT EBRW</td><td>480 or higher</td><td>420–479</td><td>360–419</td><td>Below 360</td></tr>
                      <tr><td>ACT</td><td>34 or higher</td><td>28–33</td><td>23–27</td><td>22 or below</td></tr>
                      <tr><td>Accuplacer</td><td>263 or higher</td><td>250–262</td><td>237–249</td><td>236 or below</td></tr>
                    </tbody>
                  </table>
                  <div class="info-box"><strong>Students without usable placement information:</strong> Follow the current CT State writing sample/challenge process. Students placed into ENG 0960 may use the current challenge process; students placed into ENG 1010/0910 may not challenge that placement.</div>
                  <p>Because placement rules can change, consult the <a href="https://ctstate.edu/admissions-registration/placement/">current CT State Placement page</a> when advising students or answering placement questions.</p>''')
          # remove any residual obsolete references outside navigation/style
          for node in list(s.find_all(string=lambda x: x and 'ENG 101S' in x)):
              par=node.parent
              if par and par.name in ['p','li','h3','h4']: par.decompose()
          save(p,s)

          # MODULE GUIDE
          p,s=load('module-guide.html')
          h=heading(s,'About This Guide')
          if h:
              intro=h.find_next(class_='intro-box')
              if intro:
                  html_into(intro,'''
                  <h4>Purpose and Flexibility</h4>
                  <p>The ENG 1010 Module Guide offers one possible framework for organizing the semester. The modules identify common goals, topics, activities, and points of emphasis that can help instructors address the course learning outcomes.</p>
                  <p><strong>Important:</strong> This framework is a planning resource, not a required sequence. Instructors may adapt the timing, organization, readings, assignments, and activities to reflect their teaching approach and the needs of their students. Concepts may be introduced, revisited, or developed at different points in the semester. What matters is that students have meaningful opportunities to practice and demonstrate the ENG 1010 learning outcomes.</p>''')
          for mw in s.select('.module-weeks'):
              txt=mw.get_text(' ',strip=True)
              m=re.search(r'Weeks\s+([0-9]+(?:-[0-9]+)?)',txt)
              if m: mw.string='Suggested Weeks ' + m.group(1).replace('-', '–')
          replace_text_nodes(s,'Instructors usually introduce the first formal essay assignment during weeks 3-4.','Instructors may begin introducing or developing the first major writing project during this period.')
          # writer presence paragraph
          mod2=s.select_one('.module2')
          if mod2:
              for pp in mod2.find_all('p'):
                  if 'writer' in pp.get_text(' ',strip=True).lower() and 'voice' in pp.get_text(' ',strip=True).lower():
                      pp.string='Students begin to develop a clearer presence in their writing by identifying their position, responding to other perspectives, and making deliberate choices about how they enter a conversation of ideas.'; break
          # ensure paraphrasing/signal phrases are in Module 1 goals only once
          mod1=s.select_one('.module1')
          if mod1:
              target=mod1.find('ul')
              for label in ['Paraphrasing and quoting strategies','Signal phrases']:
                  for li in list(s.find_all('li')):
                      if li.get_text(' ',strip=True)==label and li.find_parent(class_='module1') is None: li.decompose()
                  if target and not any(li.get_text(' ',strip=True)==label for li in mod1.find_all('li')):
                      li=s.new_tag('li'); li.string=label; target.append(li)
          save(p,s)

          # ASSIGNMENTS
          p,s=load('assignments.html')
          intro=s.select_one('.intro-section')
          if intro:
              h=intro.find('h2'); h.string='Assignment Overview'
              html_into(intro,'''
              <h2>Assignment Overview</h2>
              <p>ENG 1010 requires students to complete at least 20 pages of finished formal writing over the course of the semester. The three assignments presented here offer a recommended sequence that moves students from close reading and critical analysis through synthesis and research-based argument. Instructors may adapt the sequence, assignment design, and topics while ensuring that students have opportunities to meet the official ENG 1010 learning outcomes.</p>
              <p>The sample prompts, scaffolding strategies, and assignment-design principles on this page are intended as resources rather than required templates.</p>''')
          for old,new in [('3-4 pages','3-5 pages'),('5-6 pages','5-7 pages'),('7-9 pages','6-8 pages')]: replace_text_nodes(s,old,new)
          e2=s.select_one('.essay-two')
          if e2:
              ph=heading(e2,'Purpose')
              pp=ph.find_next('p') if ph else e2.find('p')
              if pp: pp.string='Essay 2 builds on the analytical work of Essay 1 by asking students to synthesize multiple sources, respond to different perspectives, and develop their own position within a conversation of ideas.'
          for hh in s.find_all(['h2','h3']):
              if 'Timeline' in hh.get_text(' ',strip=True): hh.string='Sample Timeline for a 15-Week Semester'
          grid=s.select_one('.requirement-grid')
          if grid and 'Planning Note:' not in s.get_text(' ',strip=True):
              note=s.new_tag('div',attrs={'class':'info-box'})
              strong=s.new_tag('strong'); strong.string='Planning Note: '; note.append(strong)
              note.append('Because course designs and assignment lengths vary, instructors should plan additional formal writing or adjust assignment lengths as appropriate to meet the 20-page course requirement.')
              grid.insert_after(note)
          save(p,s)

          # FACULTY SUPPORT: replace brittle handbook material with current support hub
          p,s=load('faculty-support.html')
          content=s.find(id='main-content') or s.select_one('.content')
          if not content: raise SystemExit('Faculty Support main content not found')
          html_into(content,'''
          <div class="intro-section">
            <h2>Faculty Support &amp; Resources</h2>
            <p>This page brings together the primary people and current CT State resources that can support your work in ENG 1010. Because campus contacts, services, and procedures can change, use the linked CT State pages for the most current institutional information.</p>
          </div>
          <div class="section">
            <h2>ENG 1010 Support</h2>
            <div class="contact-card">
              <h4>Joseph Selvaggio - ENG 1010 Curriculum Leader</h4>
              <p><strong>Email:</strong> <a href="mailto:joseph.selvaggio@ctstate.edu">joseph.selvaggio@ctstate.edu</a></p>
              <p><strong>Contact for:</strong> ENG 1010 curriculum questions, learning outcomes, course materials, assignment and course design, required text questions, and the ENG 1010/0910 corequisite model.</p>
            </div>
            <p>Faculty may also contact the department chair when questions involve departmental procedures, student concerns, or situations where additional guidance would be helpful.</p>
          </div>
          <div class="section">
            <h2>Three Rivers Student Support</h2>
            <div class="resource-box">
              <h4>Tutoring and Academic Success Center (TASC)</h4>
              <p>TASC provides writing and academic support for students and offers resources that can also help faculty connect students with tutoring. For current hours and services, use the CT State tutoring page.</p>
              <p><strong>Three Rivers:</strong> C-113 | 860-215-9082 | <a href="mailto:tr-TASC@ctstate.edu">tr-TASC@ctstate.edu</a> | <a href="mailto:TRWritingCenter@ctstate.edu">TRWritingCenter@ctstate.edu</a></p>
              <p><a href="https://ctstate.edu/academics/tutoring">Current CT State Tutoring Resources</a></p>
            </div>
            <div class="resource-box">
              <h4>Three Rivers Campus Resources</h4>
              <p>The current Three Rivers campus page provides links to advising, accessibility services, library resources, mental-health support, public safety, food assistance, tutoring, and other student services.</p>
              <p><a href="https://ctstate.edu/locations/three-rivers">Three Rivers Campus Resources</a></p>
            </div>
          </div>
          <div class="section">
            <h2>Faculty &amp; Teaching Resources</h2>
            <div class="resource-box">
              <h4>CT State Faculty &amp; Staff Resources</h4>
              <p>Use this page for current faculty forms, academic engagement guidance, syllabus resources, IT and Blackboard support, disability-support information, tutoring resources, and other faculty-facing materials.</p>
              <p><a href="https://ctstate.edu/for-you/faculty-staff">CT State Faculty &amp; Staff Resources</a></p>
            </div>
            <div class="resource-box">
              <h4>Center for Teaching</h4>
              <p>CT State's Center for Teaching provides professional-development opportunities, teaching resources, and faculty support across the college.</p>
              <p><a href="https://ctstate.edu/cft">CT State Center for Teaching</a></p>
            </div>
          </div>
          <div class="section">
            <h2>Campus &amp; Employment Resources</h2>
            <p>For current information about HR, payroll, campus access, parking, technology, facilities, and other employment or campus procedures, consult the CT State Faculty &amp; Staff resources and the Three Rivers campus page rather than relying on older local instructions.</p>
          </div>
          <div class="section">
            <h2>Help Improve This Guide</h2>
            <p>This faculty guide is a living resource. If you notice an outdated link, have a suggestion, or would like to share a resource that could help ENG 1010 faculty, contact Joseph Selvaggio at <a href="mailto:joseph.selvaggio@ctstate.edu">joseph.selvaggio@ctstate.edu</a>.</p>
          </div>''')
          save(p,s)

          # SITE-WIDE visual and footer normalization
          for name in CORE:
              p,s=load(name)
              strip_heading_icons(s)
              if name != 'index.html': add_spacing(s)
              normalize_footer(s)
              save(p,s)
          PY

      - name: Run full 12-page publication audit
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          import re, sys

          files=[
              'index.html','getting-started.html','course-overview.html','corequisite-model.html',
              'module-guide.html','assignments.html','instructional-strategies.html','assessment.html',
              'syllabus-templates.html','policies.html','ai-policy.html','faculty-support.html'
          ]
          errors=[]
          for name in files:
              p=Path(name); s=p.read_text(encoding='utf-8'); soup=BeautifulSoup(s,'html.parser')
              if not soup.find(id='main-content'): errors.append(f'{name}: missing main-content')
              if not soup.find('a',href='#main-content'): errors.append(f'{name}: missing skip link')
              if not soup.find('a',attrs={'aria-current':'page'}): errors.append(f'{name}: missing aria-current')
              if 'CEO' in s or 'Chief Executive Officer' in s: errors.append(f'{name}: obsolete CEO title')
              if 'Last Updated: November 2024' in s or 'Last Updated: Nov' in s: errors.append(f'{name}: stale footer')
              if 'Last updated: August 2026' not in s: errors.append(f'{name}: footer not normalized')
              for a in soup.find_all('a',href=True):
                  href=a['href'].split('#')[0].split('?')[0]
                  if href.endswith('.html') and not Path(href).exists(): errors.append(f'{name}: missing local link {href}')
              for h in soup.find_all(['h2','h3','h4']):
                  if h.find('i'): errors.append(f'{name}: decorative icon remains in heading {h.get_text(" ",strip=True)[:40]}')
          checks={
              'index.html':['About the CT State - Three Rivers ENG 1010 Faculty Guide','4 outcome areas covering rhetorical situations'],
              'getting-started.html':['Welcome to ENG 1010','First-Year Writing Task Force Mission','Email your syllabus to the department chair and the dean'],
              'course-overview.html':['Composition focuses on the study and practice of effective written communication','Curriculum Leader or Department Chair','required text and/or supplemental readings'],
              'corequisite-model.html':['Current Placement Criteria','2.8 or higher','250–262'],
              'module-guide.html':['planning resource, not a required sequence','Suggested Weeks'],
              'assignments.html':['at least 20 pages of finished formal writing','Planning Note:','5-7 pages','6-8 pages'],
              'instructional-strategies.html':['Teaching Approaches'],
              'assessment.html':['Assessment Approaches','Portfolio Assessment: An Optional Approach'],
              'syllabus-templates.html':['Syllabus Guidance'],
              'policies.html':['Ronda.Charette@ctstate.edu','MUST be submitted'],
              'ai-policy.html':['AI Guidance for ENG 1010','Permission','AI Detection Requires Caution'],
              'faculty-support.html':['Faculty Support & Resources','Tutoring and Academic Success Center','Center for Teaching','Help Improve This Guide'],
          }
          forbidden={
              'corequisite-model.html':['ENG 101S','Guided Self-Placement','2023-2024 Placement Criteria'],
              'module-guide.html':['Assignment Period'],
              'assignments.html':['three formal essays totaling at least 20 pages','7-9 pages'],
              'assessment.html':['Labor-Based Grading'],
              'ai-policy.html':['Policy Under Development'],
              'faculty-support.html':['ACME English Leads','Mandatory for new faculty','You can\'t pour from an empty cup'],
          }
          for name,needles in checks.items():
              s=Path(name).read_text(encoding='utf-8')
              for n in needles:
                  if n not in s: errors.append(f'{name}: missing approved marker: {n}')
          for name,needles in forbidden.items():
              s=Path(name).read_text(encoding='utf-8')
              for n in needles:
                  if n in s: errors.append(f'{name}: stale/forbidden text remains: {n}')
          if errors:
              print('\n'.join('ERROR: '+e for e in errors))
              raise SystemExit(1)
          print('FINAL AUDIT PASSED: 12 core pages; locked content markers, terminology, local links, accessibility hooks, icons, and August 2026 footers validated.')
          PY

      - name: Commit finalized publication branch
        run: |
          rm -f .github/workflows/finalize-faculty-guide.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize ENG 1010 Faculty Guide content review"
          git push origin HEAD:agent/publishing-ready
