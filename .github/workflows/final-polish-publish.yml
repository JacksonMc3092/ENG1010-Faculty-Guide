name: Final polish before publication

on:
  push:
    branches: [agent/publishing-ready]
    paths:
      - '.github/workflows/final-polish-publish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/publishing-ready
      - name: Install parser
        run: pip install beautifulsoup4
      - name: Apply final polish
        run: python .publish-tools/final_polish.py
      - name: Validate publication polish
        run: |
          grep -q 'FINAL PUBLICATION POLISH' assets/faculty-guide.css
          grep -q 'requirement-grid' assignments.html
          ! grep -q 'Source Requirements &amp; Evaluation' assignments.html
          ! grep -q 'Minimum Required' assignments.html
          grep -q 'AI Guidance for ENG 1010' ai-policy.html
          grep -q 'Faculty Support &amp; Resources' faculty-support.html
          for f in index.html getting-started.html course-overview.html corequisite-model.html module-guide.html assignments.html instructional-strategies.html assessment.html syllabus-templates.html policies.html ai-policy.html faculty-support.html; do
            grep -q 'assets/faculty-guide.css' "$f"
            grep -q 'assets/faculty-guide.js' "$f"
            grep -q 'Skip to main content' "$f"
          done
      - name: Commit final polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/final-polish-publish.yml .publish-tools/final_polish.py
          git add assets/faculty-guide.css assignments.html
          git commit -m "Apply final Faculty Guide publication polish"
          git push
